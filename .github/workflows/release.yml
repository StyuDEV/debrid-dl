name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO: https://github.com/${{ github.repository }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          dotnet publish src/DebridDl -c Release -r win-x64 --self-contained \
            -p:Version=${GITHUB_REF_NAME#v} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Fetch previous release for delta updates
        continue-on-error: true
        run: vpk download github --repoUrl $REPO --token $TOKEN

      - name: Pack
        run: |
          vpk pack --packId DebridDl --packVersion ${GITHUB_REF_NAME#v} --packDir publish \
            --mainExe DebridDl.exe --packTitle "Debrid DL" --icon src/DebridDl/icon.ico

      - name: Upload
        run: |
          vpk upload github --repoUrl $REPO --token $TOKEN --publish \
            --releaseName "Debrid DL ${GITHUB_REF_NAME#v}" --tag $GITHUB_REF_NAME
